<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공통 UI 템플릿 카탈로그</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007d4a'/%3E%3Crect x='7' y='7' width='8' height='8' rx='2' fill='%23fff'/%3E%3Crect x='17' y='7' width='8' height='8' rx='2' fill='%23fff' fill-opacity='.55'/%3E%3Crect x='7' y='17' width='18' height='8' rx='2' fill='%23fff' fill-opacity='.8'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styleguide.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 헤더 -->
  <header class="header">
    <h1 class="logo">
      <img src="https://www.ssamplus.com/images/main2020/logo.png" alt="KG에듀원 희소쌤플러스" width="230" height="30">
      <span class="logo-sub">UI 템플릿</span>
    </h1>
    <a class="header-link" href="https://github.com/millie0519/heeso-ui/blob/main/snippets/ui-templates.md" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 1.75h5.5L12.25 4.5v9.75H4z" />
        <path d="M9.25 1.75V4.75h3" />
        <line x1="6.25" y1="8" x2="10" y2="8" stroke-linecap="round" />
        <line x1="6.25" y1="10.75" x2="10" y2="10.75" stroke-linecap="round" />
      </svg>
      <span>스니펫 문서</span>
      <span class="sr-only">(새 탭에서 열림)</span>
    </a>
  </header>

  <!-- 메인 컨텐츠 -->
  <div class="container">

    <!-- ===== 좌측 : 목록 패널 ===== -->
    <aside class="sidebar" aria-label="템플릿 목록">
      <div class="sidebar-top">
        <div class="search-field">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="7" cy="7" r="5.25" />
            <line x1="11" y1="11" x2="14.5" y2="14.5" />
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="템플릿·코드명 검색" aria-label="템플릿·코드명 검색" autocomplete="off">
          <button type="button" class="search-clear" id="searchClear" aria-label="검색어 지우기" hidden>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <line x1="2" y1="2" x2="10" y2="10" />
              <line x1="10" y1="2" x2="2" y2="10" />
            </svg>
          </button>
        </div>

        <div class="category-tabs" id="categoryTabs" role="group" aria-label="카테고리"></div>

        <p class="result-count" aria-live="polite">총 <span id="totalCount"></span>개</p>
      </div>

      <ul class="template-list" id="templateList"></ul>
    </aside>

    <!-- ===== 우측 : 미리보기 패널 ===== -->
    <main class="preview-panel">
      <div class="preview-header">
        <div class="preview-title-wrap">
          <h2 class="preview-title" id="previewTitle">기본 입력 폼</h2>
          <p class="preview-desc" id="previewDesc"></p>
        </div>
        <div class="preview-actions">
          <button type="button" class="btn btn-code" id="btnCode">코드 보기</button>
          <button type="button" class="btn btn-open" id="btnOpen">
            새 탭에서 열기
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.5 1.5h6v6" />
              <line x1="10.5" y1="1.5" x2="1.5" y2="10.5" />
            </svg>
          </button>
        </div>
      </div>
      <div class="preview-body">
        <div class="preview-progress" id="previewProgress" aria-hidden="true"></div>
        <iframe id="previewFrame" class="preview-iframe" src="templates/forms/form-basic.html" title="템플릿 미리보기"></iframe>
        <!-- 미리보기 파일이 없을 때 표시 -->
        <div class="preview-empty hide" id="previewEmpty">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="8" width="34" height="28" rx="3" />
            <line x1="5" y1="15" x2="39" y2="15" />
            <line x1="13" y1="22" x2="31" y2="22" stroke-linecap="round" />
            <line x1="13" y1="28" x2="24" y2="28" stroke-linecap="round" />
          </svg>
          <p>왼쪽 목록에서 템플릿을 선택하세요</p>
        </div>
      </div>
    </main>

  </div>

  <!-- 코드 뷰어 모달 -->
  <div class="code-modal" id="codeModal" role="dialog" aria-modal="true" aria-labelledby="codeModalTitle">
    <div class="code-modal-inner">
      <div class="code-modal-header">
        <span class="code-modal-title" id="codeModalTitle"></span>
        <div class="code-modal-actions">
          <button type="button" class="btn-copy" id="btnCopy" aria-live="polite">코드 복사</button>
          <button type="button" class="code-modal-close" id="codeModalClose" aria-label="코드 보기 닫기">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <line x1="3" y1="3" x2="17" y2="17" />
              <line x1="3" y1="17" x2="17" y2="3" />
            </svg>
          </button>
        </div>
      </div>
      <pre class="code-modal-body" tabindex="0"><code id="codeModalContent"></code></pre>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
